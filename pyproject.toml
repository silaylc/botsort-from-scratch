[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botsort-from-scratch"
version = "0.1.0"
description = "A readable, from-scratch implementation of BoT-SORT (with SORT and ByteTrack modes) for multi-object tracking"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "silaylc" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
]

[project.optional-dependencies]
yolo = ["ultralytics"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["botsort*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
